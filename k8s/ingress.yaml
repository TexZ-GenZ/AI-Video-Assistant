# Internet-facing ALB with path-based routing:
#   POST /api/upload, POST /api/process (EXACT)  → ingestion
#   everything else (/api/process/{id}/... etc.) → summarization
# target-type: ip is REQUIRED on Fargate (pods have their own ENIs).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: videosense-ingress
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api/upload
            pathType: Prefix
            backend:
              service:
                name: ingestion-api
                port:
                  number: 8001
          # EXACT match: only the bare POST /api/process goes to ingestion;
          # /api/process/{id}/status|results|ask stay on summarization.
          - path: /api/process
            pathType: Exact
            backend:
              service:
                name: ingestion-api
                port:
                  number: 8001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: summarization-api
                port:
                  number: 8002
