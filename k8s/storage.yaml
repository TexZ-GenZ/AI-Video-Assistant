# STATIC EFS provisioning (Fargate-compatible).
#
# Dynamic provisioning (provisioningMode: efs-ap) requires node topology
# labels, which don't exist on Fargate (the node daemonset can't run) — the
# provisioner fails with "no available topology found". Static PVs bind
# directly to the EFS access points created by infra/aws-provision.sh.
# Placeholders are substituted by apply.sh from infra/.videosense.env.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: whisper-cache-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: efs.csi.aws.com
    volumeHandle: "YOUR_EFS_FS_ID::YOUR_EFS_AP_MODELS"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whisper-cache-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""   # static binding — no dynamic provisioning
  volumeName: whisper-cache-pv
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: chroma-data-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: efs.csi.aws.com
    volumeHandle: "YOUR_EFS_FS_ID::YOUR_EFS_AP_CHROMA"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chroma-data-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""   # static binding — no dynamic provisioning
  volumeName: chroma-data-pv
  resources:
    requests:
      storage: 10Gi
