# EFS-backed storage (Fargate has no EBS; the EFS CSI driver is provisioned in
# infra/aws-provision.sh). Two StorageClasses because the EFS CSI driver binds
# ONE access point per StorageClass: one for the whisper model cache, one for
# chroma data. Access point ids come from infra/.videosense.env (placeholders
# substituted by apply.sh).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: YOUR_EFS_FS_ID
  accessPointId: YOUR_EFS_AP_MODELS
  directoryPerms: "700"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc-chroma
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: YOUR_EFS_FS_ID
  accessPointId: YOUR_EFS_AP_CHROMA
  directoryPerms: "700"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whisper-cache-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chroma-data-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc-chroma
  resources:
    requests:
      storage: 10Gi
