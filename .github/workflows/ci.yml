name: CI

on:
  push:
    branches: [main, eks-refactor]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system deps (ffmpeg for audio tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install moto pytest httpx

      - name: Run test suite (moto-emulated AWS)
        run: pytest tests/ -q

  build-push:
    # Only push images for merged branches (not every PR)
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/eks-refactor'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          for svc in ingestion transcription summarization; do
            echo "==> Building videosense/$svc"
            docker build -f "Dockerfile.$svc" -t "$REGISTRY/videosense/$svc:latest" .
            docker push "$REGISTRY/videosense/$svc:latest"
          done
